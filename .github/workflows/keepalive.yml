name: Repo Keepalive

on:
  schedule:
    # run at 12:00 UTC
    - cron: "0 12 * * 0"
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create keep-alive commit
        run: |
          git config user.email "keepalive@github.com"
          git config user.name "keepalive-bot"
          # Erstellt einen leeren Commit mit aktuellem Datum
          git commit --allow-empty -m "keepalive: touch $(date -u +"%Y-%m-%d")"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
