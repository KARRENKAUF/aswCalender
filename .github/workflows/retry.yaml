name: Auto Retry ASW

on:
  workflow_run:
    workflows: ["Build and publish ASW ICS"]
    types: [completed]

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest

    steps:
      - name: Trigger new workflow run
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/publish-ics.yml/dispatches \
            -d '{"ref":"main"}'
